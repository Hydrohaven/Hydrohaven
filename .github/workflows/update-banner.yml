name: Update Seasonal Banner

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-banner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README Banner
        run: |
          MONTH=$(date +%m)

          SPRING="https://i.pinimg.com/originals/3a/82/56/3a8256b391b0de71639848f2815c2b14.gif"
          SUMMER="https://64.media.tumblr.com/342233551f34116302414bf70505ed9c/ebeaa7d80c0a7223-37/s540x810/334ee9ef7b6abbb2eb55aea122d536c565ac29be.gif"
          FALL="https://cdnb.artstation.com/p/assets/images/images/025/112/011/original/anas-abdin-x-5d7af4f1d2e4ee9ddcb73250ee3d5c6b-c52e7ex-640.gif?1584652962"
          WINTER="https://cdna.artstation.com/p/assets/images/images/025/111/492/original/anas-abdin-snow.gif?1584651553"

          if [ "$MONTH" -ge 03 ] && [ "$MONTH" -le 05 ]; then
            SELECTED_URL="$SPRING"
          elif [ "$MONTH" -ge 06 ] && [ "$MONTH" -le 08 ]; then
            SELECTED_URL="$SUMMER"
          elif [ "$MONTH" -ge 09 ] && [ "$MONTH" -le 11 ]; then
            SELECTED_URL="$FALL"
          else
            SELECTED_URL="$WINTER"
          fi

          echo "Selected URL: $SELECTED_URL"

          # Replace all lines between <!--START_BANNER--> and <!--END_BANNER-->
          awk -v url="$SELECTED_URL" '
            /<!--START_BANNER-->/ {
              print;
              print "  <img src=\"" url "\" alt=\"Seasonal Banner\" width=\"100%\" style=\"max-width: 700px;\">";
              skip = 1;
              next;
            }
            /<!--END_BANNER-->/ {
              skip = 0;
            }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

          echo "--- Resulting README.md diff ---"
          git diff README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update seasonal README banner"
          file_pattern: README.md
